name: Build iOS IPA (Unsigned for Sideloading)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build GlowBay iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: |
          echo "### Flutter & Dart Version" >> $GITHUB_STEP_SUMMARY
          flutter --version >> $GITHUB_STEP_SUMMARY
          echo "### Pub Get Result" >> $GITHUB_STEP_SUMMARY
          if ! flutter pub get > pub_err.txt 2>&1; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pub_err.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat pub_err.txt
            exit 1
          fi
          echo "Pub get succeeded!" >> $GITHUB_STEP_SUMMARY

      - name: 📄 Upload Error Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: pub_err.txt

      - name: 🍏 CocoaPods Setup
        run: |
          cd ios
          pod repo update || true
          pod install || true
          cd ..

      - name: 🔨 Build iOS (Release, No CodeSign)
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 Package into Unsigned IPA (Payload)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r GlowBay-App.ipa Payload
          echo "IPA packaging complete!"
          ls -lh GlowBay-App.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlowBay-App-iOS-IPA
          path: GlowBay-App.ipa
          retention-days: 14
