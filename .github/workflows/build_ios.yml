name: Build iOS IPA (Unsigned for Sideloading)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build GlowBay iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          xcodebuild -version
          xcodebuild -showsdks

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Disable SPM & Install Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter --version
          flutter pub get

      - name: 🍏 CocoaPods Setup
        run: |
          cd ios
          pod install || pod install --repo-update || true
          cd ..

      - name: 🔨 Build iOS (Release, No CodeSign)
        run: |
          echo "=== RUNNING FLUTTER BUILD IOS ===" > xcode_build.log
          flutter build ios --release --no-codesign -v >> xcode_build.log 2>&1 || true
          tail -n 100 xcode_build.log
          
          echo "=== SEARCHING FOR RUNNER.APP ===" >> xcode_build.log
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData build ~ -name "Runner.app" -type d 2>/dev/null | head -n 1)
          echo "Discovered APP_PATH: $APP_PATH" >> xcode_build.log
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "FATAL: Runner.app could not be found anywhere!" >> xcode_build.log
            find ~ -name "*.app" -type d 2>/dev/null >> xcode_build.log || true
            exit 1
          fi
          echo "FOUND_APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Successfully located Runner.app at: $APP_PATH"

      - name: 📄 Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "CI Log Bot"
          git config user.email "bot@glowbay.com"
          git checkout -B ci-log
          git add -f xcode_build.log || true
          git commit -m "log: capture xcode_build.log" || true
          git push -f origin ci-log || true

      - name: 📦 Package into Unsigned IPA (Payload)
        run: |
          echo "Packaging from: $FOUND_APP_PATH"
          mkdir -p Payload
          cp -R "$FOUND_APP_PATH" Payload/
          zip -r -y GlowBay-App.ipa Payload
          echo "Final IPA size:"
          ls -lh GlowBay-App.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlowBay-App-iOS-IPA
          path: GlowBay-App.ipa
          retention-days: 14

      - name: 📦 Push IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.2-ios
          name: "GlowBay iOS Release IPA (v1.0.2)"
          files: GlowBay-App.ipa
          draft: false
          prerelease: false
