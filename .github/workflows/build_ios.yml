name: Build iOS IPA (Unsigned for Sideloading)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build GlowBay iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: 🍏 CocoaPods Setup
        run: |
          cd ios
          pod repo update || true
          pod install || true
          cd ..

      - name: 🔨 Build iOS (Release, No CodeSign)
        run: |
          echo "Starting Flutter iOS unsigned build..."
          flutter build ios --release --no-codesign > xcode_build.log 2>&1 || true
          tail -n 50 xcode_build.log
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "Attempting fallback build with xcodebuild..."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/ios_derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build >> xcode_build.log 2>&1 || true
            if [ -d build/ios_derived/Build/Products/Release-iphoneos/Runner.app ]; then
              mkdir -p build/ios/iphoneos
              cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/
            fi
          fi
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "ERROR: Runner.app not found!"
            tail -n 120 xcode_build.log
            exit 1
          fi

      - name: 📄 Push Error Log on Failure
        if: failure()
        run: |
          git config user.name "CI Log Bot"
          git config user.email "bot@glowbay.com"
          git checkout -B ci-log
          git add xcode_build.log || true
          git commit -m "log: capture xcode_build.log" || true
          git push -f origin ci-log || true

      - name: 📦 Package into Unsigned IPA (Payload)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r GlowBay-App.ipa Payload
          echo "IPA packaging complete!"
          ls -lh GlowBay-App.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlowBay-App-iOS-IPA
          path: GlowBay-App.ipa
          retention-days: 14

      - name: 📦 Push IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0-ios
          name: "GlowBay iOS Release IPA"
          files: GlowBay-App.ipa
          draft: false
          prerelease: false
