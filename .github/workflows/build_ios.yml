name: Build iOS IPA (Unsigned for Sideloading)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ios:
    name: Build GlowBay iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          xcodebuild -version

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Disable SPM & Install Dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter --version
          flutter pub get

      - name: 🍏 CocoaPods Setup
        run: |
          cd ios
          pod install || pod install --repo-update || true
          cd ..

      - name: 🔨 Build iOS IPA (Release, No CodeSign)
        run: |
          echo "=== EXECUTING FLUTTER BUILD IPA ==="
          flutter build ipa --release --no-codesign || flutter build ios --release --no-codesign

          echo "=== LOCATING COMPILED ARTIFACTS ==="
          find build -name "*.ipa" -o -name "Runner.app"

          IPA_FILE=$(find build/ios -name "*.ipa" | head -n 1)
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            echo "Direct IPA found at $IPA_FILE"
            cp "$IPA_FILE" GlowBay-App.ipa
          else
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
            echo "Packaging Runner.app from: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/
            zip -r -y GlowBay-App.ipa Payload
          fi

          echo "=== VERIFYING FINAL IPA ==="
          ls -lh GlowBay-App.ipa
          unzip -l GlowBay-App.ipa | head -n 25

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlowBay-App-iOS-IPA
          path: GlowBay-App.ipa
          retention-days: 14

      - name: 📦 Push IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.1-ios
          name: "GlowBay iOS Release IPA (v1.0.1)"
          files: GlowBay-App.ipa
          draft: false
          prerelease: false
